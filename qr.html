<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mã QR - Lời chúc 💗</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle,#21114b,#070418 65%);color:#fff;font-family:Arial,sans-serif;text-align:center}.box{width:min(92vw,420px);padding:30px;border:1px solid #6c3f8f;border-radius:24px;background:rgba(20,9,39,.9);box-shadow:0 0 50px #6b1d72}.qr{width:260px;height:260px;margin:20px auto;padding:14px;background:#fff;border-radius:15px;display:grid;place-items:center}.qr img{width:100%;height:100%}h1{margin:0 0 8px;color:#ff8bc6}p{color:#c9bdd7;font-size:14px;line-height:1.6}.url{word-break:break-all;color:#ffb6db;font-size:12px}.btn{display:inline-block;margin-top:12px;padding:10px 16px;border-radius:999px;text-decoration:none;color:#fff;border:1px solid #7c477f;background:#ffffff10}.btn:hover{background:#ffffff1c}
  </style>
</head>
<body>
  <main class="box">
    <h1>QR truy cập web 💗</h1>
    <p>Quét mã này bằng điện thoại để mở trang lời chúc.</p>
    <div class="qr" id="qr"></div>
    <div class="url" id="url"></div>
    <a class="btn" href="index.html">← Quay lại web</a>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const target = new URL('index.html', window.location.href).href;
    document.getElementById('url').textContent = target;
    new QRCode(document.getElementById('qr'), { text: target, width: 230, height: 230, correctLevel: QRCode.CorrectLevel.H });
  </script>
</body>
</html>
