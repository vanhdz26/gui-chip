<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gửi Chip 💗</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Hiệu ứng nền -->
    <div class="stars"></div>
    <div class="hearts"></div>


    <!-- =========================
         NỘI DUNG CHÍNH
    ========================== -->

    <main class="container">

        <h1>
            Có một thứ tui muốn gửi cho Chip
            <span>💗</span>
        </h1>

        


        <!-- =========================
             PHONG BÌ
        ========================== -->

        <div class="envelope-wrapper" id="envelope">

            <div class="envelope">


                <!-- =========================
                     LÁ THƯ
                ========================== -->

                <div class="letter">

                    <img
                        src="chip-2.jpg"
                        alt="Ảnh của Chip"
                    >

                    <div class="message">
                        Nàng ơi đừng dỗi vanh nữa nha 🫶
                    </div>

                </div>


                <!-- =========================
                     NẮP PHONG BÌ
                ========================== -->

                <div class="flap"></div>


                <!-- =========================
                     MẶT TRƯỚC PHONG BÌ
                ========================== -->

                <div class="front">

                    <div class="heart-button">
                        ♥
                    </div>

                </div>

            </div>

        </div>


        <!-- Hướng dẫn -->

        <p class="hint">
            💌 Chạm vào phong bì để mở
        </p>


        <!-- Nút đóng -->

        <button
            id="closeBtn"
            class="close-btn"
        >
            Đóng thư ↩
        </button>

    </main>


    <script src="script.js"></script>

</body>

</html>
